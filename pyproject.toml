[project]
name = "perfeng-contracts"
version = "0.6.0"
description = "Language-neutral performance contracts and their validation tooling"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.7.2,<1",
    "jsonschema[format]>=4.26.0,<5",
    "referencing>=0.37.0,<0.38",
    "ruff>=0.16.4,<0.17",
    "ty>=0.0.1,<1",
    "types-jsonschema",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["scripts", "tests"]

[tool.ty.terminal]
error-on-warning = true
