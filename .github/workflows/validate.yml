name: Validate contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
      - run: uv run --locked python scripts/validate.py
      - run: uv run --locked python scripts/validate_api.py
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Assemble candidate contract bundle
        run: |
          mkdir -p dist
          tar -czf dist/perfeng-contracts-0.8.0.tar.gz contracts.json schemas examples api docs tests/fixtures README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: perfeng-contracts-0.8.0
          path: dist/perfeng-contracts-0.8.0.tar.gz
