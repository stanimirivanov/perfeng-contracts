name: Publish protected contract tracer

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit at the head of protected main
        required: true
        type: string

permissions: {}

concurrency:
  group: contract-tracer-publication
  cancel-in-progress: false

env:
  RELEASE_ID: contract-tracer-${{ github.run_id }}

jobs:
  prepare:
    if: >-
      github.repository == 'stanimirivanov/perfeng-contracts' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.sha == inputs.expected_sha && github.run_attempt == 1 &&
      vars.PERFENG_TRACER_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Verify and assemble the fixed tracer
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --locked
          make distribution-check publication-check
          uv run --locked --offline python -m scripts.contracts_tracer \
            --release-id "$RELEASE_ID" --output release-inputs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tracer-inputs
          path: release-inputs/
          if-no-files-found: error

  attest:
    needs: prepare
    if: >-
      github.repository == 'stanimirivanov/perfeng-contracts' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.sha == inputs.expected_sha && github.run_attempt == 1 &&
      vars.PERFENG_TRACER_PUBLICATION_ENABLED == 'true'
    environment: contract-tracer-attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tracer-inputs
          path: release-inputs
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: release-inputs/manifest.json
      - name: Preserve the offline provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE_PATH"
          cp -- "$BUNDLE_PATH" manifest.sigstore.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tracer-provenance
          path: manifest.sigstore.jsonl
          if-no-files-found: error

  publish:
    needs: attest
    if: >-
      github.repository == 'stanimirivanov/perfeng-contracts' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.sha == inputs.expected_sha && github.run_attempt == 1 &&
      vars.PERFENG_TRACER_PUBLICATION_ENABLED == 'true'
    environment: contract-tracer-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tracer-inputs
          path: release-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tracer-provenance
          path: release-inputs
      - name: Prepare checksum-pinned release CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gh_2.103.3_linux_amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error \
            --location --max-time 120 --output "$archive" \
            https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz
          echo "4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d  $archive" | sha256sum --check
          tar -xOzf "$archive" gh_2.103.3_linux_amd64/bin/gh > "$RUNNER_TEMP/tracer-gh"
          echo "b768184570b12536be4ac1528893f6340d1c6a7b40b56ad45bca9cd0e87ad34d  $RUNNER_TEMP/tracer-gh" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/tracer-gh"
      - name: Publish the complete tracer release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh="$RUNNER_TEMP/tracer-gh"
          for asset in candidate.json admission.json manifest.json manifest.sigstore.jsonl tracer.tar.gz; do
            test -s "release-inputs/$asset"
          done
          "$gh" api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_ID" -f "sha=$GITHUB_SHA" > /dev/null
          "$gh" release create "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --latest=false --title "Contract tracer $GITHUB_RUN_ID" \
            --notes "Protected tracer from $GITHUB_SHA." \
            release-inputs/candidate.json release-inputs/admission.json \
            release-inputs/manifest.json release-inputs/manifest.sigstore.jsonl \
            release-inputs/tracer.tar.gz
          "$gh" release edit "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
